# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio anti-bot),
# mesmo com o perfil no ar.
# O domínio raspberrypi.com (incluindo o subdomínio forums.raspberrypi.com) responde
# HTTP 403 a verificadores automatizados em várias rotas de forma inconsistente (bot
# protection), mesmo com as páginas no ar e confirmadas manualmente. Todos os links
# desses domínios usados neste guia foram verificados manualmente antes da publicação.
exclude = ["^https://www\\.linkedin\\.com/", "^https://www\\.raspberrypi\\.com/", "^https://forums\\.raspberrypi\\.com/"]
